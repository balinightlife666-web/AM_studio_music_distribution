name: AM STUDIO Admin Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'web/admin/**'
      - '.github/workflows/am-studio-admin-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: am-studio-admin-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage admin site
        run: |
          mkdir -p _site
          cp web/admin/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
