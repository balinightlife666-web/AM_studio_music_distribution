name: AM STUDIO Cloudflare Backend Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - 'web/admin/**'
      - 'wrangler.jsonc'
      - '.github/workflows/am-studio-cloudflare.yml'
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - 'web/admin/**'
      - 'wrangler.jsonc'
      - '.github/workflows/am-studio-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: am-studio-cloudflare-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dry-run

      - name: Deployment path
        run: echo 'Public deployment is handled by the existing Cloudflare Git integration. No repository-level Cloudflare API token is required by this workflow.'
