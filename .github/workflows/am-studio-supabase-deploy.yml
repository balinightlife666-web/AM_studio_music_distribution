name: AM STUDIO Supabase Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/am-studio-supabase-deploy.yml'

permissions:
  contents: read

concurrency:
  group: am-studio-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      AM_STUDIO_ADMIN_TOKEN: ${{ secrets.AM_STUDIO_ADMIN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deployment secrets
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$AM_STUDIO_ADMIN_TOKEN"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --include-all

      - name: Configure admin secret
        run: supabase secrets set AM_STUDIO_ADMIN_TOKEN="$AM_STUDIO_ADMIN_TOKEN" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy API
        run: supabase functions deploy am-studio --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api

      - name: Print endpoint
        run: echo "AM STUDIO API deployed to https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/am-studio"
