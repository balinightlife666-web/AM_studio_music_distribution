name: AM STUDIO Migration Readiness

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare deployment configuration without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!name:-}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
              missing=1
            fi
          done
          echo ""
          if [ "$missing" -eq 0 ]; then
            echo "MIGRATION_DEPLOYMENT_CREDENTIALS=READY"
          else
            echo "MIGRATION_DEPLOYMENT_CREDENTIALS=INCOMPLETE"
          fi
          exit 0
